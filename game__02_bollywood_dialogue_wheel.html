function wrapHindi(text,maxWidth,maxLines){const words=text.trim().split(/\s+/),lines=[];let current='';for(const word of words){const next=current?current+' '+word:word;if(ctx.measureText(next).width<=maxWidth||!current){current=next}else{lines.push(current);current=word}if(lines.length===maxLines)break}if(lines.length<maxLines&&current)lines.push(current);const represented=lines.join(' ').replace(/…$/,'');if(represented.length<text.trim().length){let last=lines[lines.length-1]||'';while(last&&ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[lines.length-1]=last.trim()+'…'}return lines}

function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(freq,dur,type,vol,delay){if(!soundOn)return;initAudio();const o=audio.createOscillator(),g=audio.createGain(),at=audio.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||.06,at);g.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+dur)}function startSpinNoise(){if(!soundOn)return;initAudio();const length=audio.sampleRate*2,buffer=audio.createBuffer(1,length,audio.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<length;i++)samples[i]=Math.random()*2-1;const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();source.buffer=buffer;source.loop=true;filter.type='bandpass';filter.frequency.value=1550;filter.Q.value=.7;gain.gain.value=.042;source.connect(filter).connect(gain).connect(audio.destination);source.start();spinNoise={source,filter,gain}}function updateSpinNoise(p){if(!spinNoise)return;const now=audio.currentTime;spinNoise.filter.frequency.setTargetAtTime(1550-1350*p,now,.045);spinNoise.gain.gain.setTargetAtTime(.042*(1-.82*p),now,.05)}function stopSpinNoise(){if(!spinNoise)return;const now=audio.currentTime,n=spinNoise;spinNoise=null;n.gain.gain.cancelScheduledValues(now);n.gain.gain.setValueAtTime(Math.max(n.gain.gain.value,.002),now);n.gain.gain.exponentialRampToValueAtTime(.001,now+.14);n.source.stop(now+.15)}function tick(progress){const p=progress||0,notes=[880,1047,1319,1568],f=notes[arcadeStep++%notes.length]*(1-.28*p);tone(f,.055,'square',.055,0);tone(f/2,.08,'triangle',.026,0)}function celebrate(){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.08,i*.09))}function openResult(item){document.getElementById('modalHindi').textContent=item.hindi;document.getElementById('modalRoman').textContent=item.roman;modal.classList.add('open');celebrate()}function closeResult(){modal.classList.remove('open')}
function spin(){if(spinning)return;initAudio();arcadeStep=0;startSpinNoise();spinning=true;spinBtn.disabled=true;const chosen=Math.floor(Math.random()*DATA.length),step=Math.PI*2/DATA.length,start=performance.now(),duration=4400,startRot=rotation,landing=-chosen*step-step/2,target=startRot+Math.PI*2*7+((landing-startRot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);let lastTick=-1;function frame(now){const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,4);rotation=startRot+(target-startRot)*ease;updateSpinNoise(p);drawWheel();const mark=Math.floor(rotation/step*2);if(mark!==lastTick){lastTick=mark;tick(p)}if(p<1)requestAnimationFrame(frame);else{stopSpinNoise();rotation=landing;drawWheel();spinning=false;spinBtn.disabled=false;openResult(DATA[chosen])}}requestAnimationFrame(frame)}
spinBtn.onclick=spin;document.getElementById('closeModal').onclick=closeResult;document.getElementById('closeMain').onclick=closeResult;soundBtn.onclick=function(){soundOn=!soundOn;if(!soundOn)stopSpinNoise();this.textContent=soundOn?'🔊':'🔇';this.classList.toggle('off',!soundOn)};document.getElementById('fullBtn').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.addEventListener('keydown',function(e){if(e.key==='Escape')closeResult();if(e.code==='Space'&&!modal.classList.contains('open')){e.preventDefault();spin()}});document.addEventListener('pointerdown',initAudio,{once:true});drawWheel();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawWheel);
