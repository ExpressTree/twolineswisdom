function renderSaveState(){const e=document.getElementById('saveState');if(e)e.textContent=ui.saving?'Saving…':ui.dirty?'Unsaved changes':'Saved in browser database'}
function bindGlobal(){document.getElementById('importFile').onchange=importWorkspace;window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow()}if(e.key==='Escape'){ui.modal=null;ui.connectMode=false;ui.connectSource=null;render()}});window.addEventListener('beforeunload',()=>{if(ui.dirty)saveNow()})}
function render(){document.getElementById('app').innerHTML=`<div class="app">${topbarHtml()}${tabsHtml()}<main class="main">${pageHtml()}</main>${statusHtml()}</div>`;document.getElementById('modal').innerHTML=modalHtml();renderSaveState();if(ui.tab==='relations')requestAnimationFrame(()=>{drawEdges();bindGraphEvents()});if(ui.tab==='preview')requestAnimationFrame(bindPreviewEvents)}
function topbarHtml(){return `<header class="topbar"><div class="brand">SPINE</div><div class="product">Unified Documentation & Relationship Studio</div><div class="workspace-title">${esc(workspace.project?.project||workspace.project?.title||'SPINE Workspace')}</div><span id="saveState" class="save-state"></span><div class="top-actions"><button class="icon-btn" onclick="toggleTheme()">◐ Theme</button><button class="icon-btn" onclick="document.getElementById('importFile').click()">Import</button><button class="icon-btn" onclick="exportWorkspace()">Export JSON</button><button class="icon-btn" onclick="resetDemo()">Restore Demo</button><button class="primary" onclick="openObjectModal()">＋ New Object</button></div></header>`}
function tabsHtml(){return `<nav class="navtabs">${[['overview','Overview'],['templates','Template Master'],['objects','Object Repository'],['relations','Relationship Studio'],['preview','Relationship Explorer']].map(([id,label])=>`<button class="navtab ${ui.tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('')}</nav>`}
function statusHtml(){return `<footer class="statusbar"><span>Templates: ${workspace.templates.length}</span><span>Objects: ${workspace.objects.length}</span><span>Relations: ${workspace.relations.length}</span><span>Layers: ${workspace.layers.length}</span><span class="spacer"></span><span>IndexedDB persistence · Live Relationship Explorer · JSON backup supported</span></footer>`}
function pageHtml(){if(ui.tab==='templates')return templateManagerHtml();if(ui.tab==='objects')return objectManagerHtml();if(ui.tab==='relations')return relationStudioHtml();if(ui.tab==='preview')return relationshipExplorerHtml();return overviewHtml()}
function switchTab(tab){ui.tab=tab;ui.search='';if(tab==='preview'&&!ui.previewSelectedObjectId&&ui.selectedObjectId)ui.previewSelectedObjectId=ui.selectedObjectId;render()}
function overviewHtml(){const placed=Object.keys(workspace.positions||{}).filter(id=>objectById(id)).length,templUsed=new Set(workspace.objects.map(o=>o.templateId)).size,crit=workspace.objects.filter(o=>o.criticality==='Critical').length,verify=workspace.objects.filter(o=>o.status==='To Verify').length;const recent=[...workspace.objects].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,8);const catStats=workspace.categories.slice(0,8).map(c=>{const tids=workspace.templates.filter(t=>t.category===c.id).map(t=>t.id),count=workspace.objects.filter(o=>tids.includes(o.templateId)).length;return {name:c.name,count,pct:Math.min(100,Math.round(count/Math.max(1,tids.length)*18))}});return `<section class="page"><div class="hero"><div><h1>One repository for structures, records and relationships</h1><p>Master Templates define standard information structures. Object Records store the actual information entered with those templates. Relationship Studio connects the saved objects visually, while the right panel displays their complete template-based details.</p></div><div class="hero-actions"><button class="primary" onclick="switchTab('relations')">Open Relationship Studio</button><button class="btn" onclick="openTemplateModal()">Create Template</button><button class="btn" onclick="exportGraph()">Export Graph</button></div></div><div class="kpi-grid"><div class="kpi"><b>${workspace.templates.length}</b><span>Master Templates</span></div><div class="kpi"><b>${workspace.objects.length}</b><span>Object Records</span></div><div class="kpi"><b>${workspace.relations.length}</b><span>Typed Relations</span></div><div class="kpi"><b>${placed}</b><span>Placed on Canvas</span></div><div class="kpi"><b>${crit}</b><span>Critical Objects</span></div></div><div class="section-grid"><div class="card"><div class="card-head"><h2>Recently updated objects</h2><button class="btn" onclick="switchTab('objects')">View repository</button></div><div class="card-body">${recent.map(o=>`<div class="activity" onclick="ui.selectedObjectId='${jsq(o.id)}';switchTab('objects')"><div class="code">${esc(o.templateId)}</div><div><strong>${esc(o.title)}</strong><small>${esc(o.id)} · ${esc(o.layer)} · ${esc(o.status)}</small></div><span class="pill ${o.criticality==='Critical'?'red':''}">${esc(o.criticality)}</span></div>`).join('')}</div></div><div class="card"><div class="card-head"><h2>Template usage coverage</h2><span class="pill amber">${templUsed}/${workspace.templates.length} used</span></div><div class="card-body">${catStats.map(x=>`<div class="coverage-row"><b>${esc(x.name)}</b><div class="track"><i style="width:${x.pct}%"></i></div><span>${x.count}</span></div>`).join('')}<div class="coverage-row"><b>To Verify</b><div class="track"><i style="width:${Math.min(100,verify)}%"></i></div><span>${verify}</span></div></div></div></div></section>`}
function templateManagerHtml(){const q=ui.search.toLowerCase(),list=workspace.templates.filter(t=>!q||(`${t.id} ${t.name} ${t.purpose} ${categoryName(t.category)}`).toLowerCase().includes(q));const selected=templateById(ui.selectedTemplateId);return `<section class="manager"><aside class="list-pane"><div class="pane-toolbar"><div class="row"><button class="primary" onclick="openTemplateModal()">＋ Template</button><button class="btn" onclick="openCategoryModal()">Layers/Categories</button></div><input class="search" placeholder="Search templates…" value="${esc(ui.search)}" oninput="ui.search=this.value;render()"></div><div class="list-scroll">${workspace.categories.map(c=>{const arr=list.filter(t=>t.category===c.id);if(!arr.length)return'';return `<div class="group-title">${esc(c.name)}</div>${arr.map(t=>`<div class="list-item ${ui.selectedTemplateId===t.id?'active':''}" onclick="ui.selectedTemplateId='${jsq(t.id)}';render()"><div class="list-code">${esc(t.id)}</div><div><strong>${esc(t.name)}</strong><small>${esc(t.purpose)}</small></div><span class="count">${workspace.objects.filter(o=>o.templateId===t.id).length}</span></div>`).join('')}`}).join('')}</div></aside><div class="detail-pane">${selected?templateDetailHtml(selected):emptyHtml('Select a template','Choose a template from the left to inspect or edit its standard structure.')}</div></section>`}
function templateDetailHtml(t){const count=workspace.objects.filter(o=>o.templateId===t.id).length;return `<div class="detail-header"><div class="top"><div><span class="pill red">${esc(t.id)}</span><h1>${esc(t.name)}</h1><p>${esc(t.purpose)}</p></div><div class="detail-actions"><button class="btn" onclick="openTemplateModal('${jsq(t.id)}')">Edit</button><button class="btn" onclick="duplicateTemplate('${jsq(t.id)}')">Duplicate</button><button class="btn danger" onclick="deleteTemplate('${jsq(t.id)}')">Delete</button><button class="primary" onclick="openObjectModal(null,'${jsq(t.id)}')">Create Object</button></div></div><div class="meta-grid"><div class="meta-box"><label>Category</label><b>${esc(categoryName(t.category))}</b></div><div class="meta-box"><label>Fields</label><b>${t.fields.length}</b></div><div class="meta-box"><label>Objects</label><b>${count}</b></div><div class="meta-box"><label>Source</label><b>${esc(t.sourceLevel||'Custom')}</b></div></div></div><div class="field-card"><div class="card-head"><h2>Template field structure</h2><span class="pill">${t.fields.filter(f=>f.required).length} required</span></div><table class="field-table"><tbody>${t.fields.map((f,i)=>`<tr><th>${i+1}. ${esc(f.label)}${f.required?' *':''}<span class="guide">${esc(String(f.guidance||'').replace(/<<|>>/g,''))}</span></th><td><b>${esc(f.key)}</b><br><span class="pill">${esc(f.input||'text')}</span>${f.options?.length?` <span class="guide">${esc(f.options.join(' · '))}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function objectManagerHtml(){const q=ui.search.toLowerCase(),list=workspace.objects.filter(o=>!q||(`${o.id} ${o.title} ${o.layer} ${o.status} ${o.tags?.join(' ')} ${o.summary}`).toLowerCase().includes(q));const selected=objectById(ui.selectedObjectId);return `<section class="manager"><aside class="list-pane"><div class="pane-toolbar"><div class="row"><button class="primary" onclick="openObjectModal()">＋ Object</button><button class="btn" onclick="exportObjectList()">Export list</button></div><input class="search" placeholder="Search objects, IDs, layers…" value="${esc(ui.search)}" oninput="ui.search=this.value;render()"></div><div class="list-scroll">${workspace.layers.map(l=>{const arr=list.filter(o=>o.layer===l);if(!arr.length)return'';return `<div class="group-title">${esc(l)}</div>${arr.map(o=>`<div class="list-item ${ui.selectedObjectId===o.id?'active':''}" onclick="ui.selectedObjectId='${jsq(o.id)}';render()"><div class="list-code">${esc(o.templateId)}</div><div><strong>${esc(o.title)}</strong><small>${esc(o.id)} · ${esc(o.status)}</small></div><span class="count">${workspace.relations.filter(r=>r.source===o.id||r.target===o.id).length}</span></div>`).join('')}`}).join('')}</div></aside><div class="detail-pane">${selected?objectDetailHtml(selected):emptyHtml('Select an object','Choose a stored object record to preview all information captured through its template.')}</div></section>`}
function objectDetailHtml(o){const t=templateById(o.templateId),rels=workspace.relations.filter(r=>r.source===o.id||r.target===o.id);return `<div class="detail-header"><div class="top"><div><span class="pill red">${esc(o.templateId)} · ${esc(t.name)}</span><h1>${esc(o.title)}</h1><p>${esc(o.summary||t.purpose)}</p></div><div class="detail-actions"><button class="btn" onclick="openObjectModal('${jsq(o.id)}')">Edit</button><button class="btn" onclick="duplicateObject('${jsq(o.id)}')">Duplicate</button><button class="btn" onclick="exportObjectWord('${jsq(o.id)}')">Word</button><button class="btn" onclick="printObject('${jsq(o.id)}')">PDF/Print</button><button class="btn danger" onclick="deleteObject('${jsq(o.id)}')">Delete</button><button class="primary" onclick="openRelationModal(null,'${jsq(o.id)}')">Connect</button></div></div><div class="meta-grid"><div class="meta-box"><label>Object ID</label><b>${esc(o.id)}</b></div><div class="meta-box"><label>Layer</label><b>${esc(o.layer)}</b></div><div class="meta-box"><label>Status</label><b>${esc(o.status)}</b></div><div class="meta-box"><label>Criticality</label><b>${esc(o.criticality)}</b></div><div class="meta-box"><label>Owner</label><b>${esc(o.owner||'—')}</b></div><div class="meta-box"><label>Version</label><b>${esc(o.version||'—')}</b></div><div class="meta-box"><label>Doxis ID</label><b>${esc(o.doxisId||'—')}</b></div><div class="meta-box"><label>Relations</label><b>${rels.length}</b></div></div></div><div class="field-card"><div class="card-head"><h2>Template-based object data</h2><span class="pill">${t.fields.length} fields</span></div><table class="field-table"><tbody>${t.fields.map(f=>`<tr><th>${esc(f.label)}${f.required?' *':''}<span class="guide">${esc(String(f.guidance||'').replace(/<<|>>/g,''))}</span></th><td>${esc(o.fields?.[f.key]||'—')}</td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:12px"><div class="card-head"><h2>Connected objects (${rels.length})</h2><button class="btn" onclick="ui.previewSelectedObjectId='${jsq(o.id)}';switchTab('preview')">Preview graph</button></div><div class="card-body">${rels.length?rels.map(r=>{const other=objectById(r.source===o.id?r.target:r.source);return `<div class="activity" onclick="ui.selectedObjectId='${jsq(other?.id||'')}';render()"><div class="code">${esc(r.type)}</div><div><strong>${esc(other?.title||'Missing object')}</strong><small>${esc(r.label||r.id)} · ${esc(r.criticality||'')}</small></div><span>›</span></div>`}).join(''):'<p class="confirm-text">No relationships have been created for this object.</p>'}</div></div>`}
function emptyHtml(title,text){return `<div class="empty"><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>`}
function relationStudioHtml(){const size=worldSize(),z=ui.zoom,sw=Math.max(1,Math.ceil(size.w*z)),sh=Math.max(1,Math.ceil(size.h*z));return `<section class="graph-shell"><aside class="graph-left"><div class="graph-toolbar"><button class="primary" onclick="openObjectModal()">＋ Object</button><button class="btn" onclick="openRelationModal()">＋ Relation</button><input class="search" placeholder="Find objects…" value="${esc(ui.graphSearch)}" oninput="ui.graphSearch=this.value;render()"></div><div class="object-library">${libraryHtml()}</div></aside><div class="graph-center"><div class="graph-head"><button class="btn ${ui.connectMode?'active':''}" onclick="toggleConnectMode()">⇄ Connect</button><button class="btn" onclick="autoLayout()">Auto Layout</button><button class="btn" onclick="fitGraph('all')">Fit All</button><button class="btn" onclick="fitGraph('width')">Fit Width</button><button class="btn" onclick="resetGraphView()">100%</button><button class="btn" onclick="clearFocus()">Show All</button><button class="btn" onclick="switchTab('preview')">Open Preview</button><select class="btn" onchange="ui.graphLayer=this.value;render()"><option>All</option>${workspace.layers.map(l=>`<option ${ui.graphLayer===l?'selected':''}>${esc(l)}</option>`).join('')}</select><select class="btn" onchange="ui.graphStatus=this.value;render()"><option>All</option>${STATUS_OPTIONS.map(s=>`<option ${ui.graphStatus===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn" onclick="zoomGraph(-.1)">−</button><span id="graphZoomValue" class="pill">${Math.round(ui.zoom*100)}%</span><button class="btn" onclick="zoomGraph(.1)">＋</button><span style="margin-left:auto" class="pill ${ui.connectMode?'amber':''}">${ui.connectMode?(ui.connectSource?'Select target object':'Choose or drag from a red connector'):'Pan empty canvas · Ctrl/⌘ + wheel to zoom'}</span></div><div id="graphViewport" class="graph-viewport" ondragover="event.preventDefault()" ondrop="dropObject(event)"><div id="graphStage" class="graph-stage" style="width:${sw}px;height:${sh}px"><div id="graphWorld" class="graph-world" style="transform:scale(${z});width:${size.w}px;height:${size.h}px">${bandsHtml()}<svg id="edgeSvg" class="edge-svg" viewBox="0 0 ${size.w} ${size.h}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa4b3"></path></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5000f"></path></marker></defs><g id="edgePaths"></g><path id="tempEdge" class="temp-edge" d=""></path></svg>${nodesHtml()}</div></div><div class="graph-pan-indicator">Pan · Zoom · Scroll enabled</div></div></div><aside class="graph-right"><div class="graph-toolbar"><strong>Details & Connections</strong><button class="btn" style="margin-left:auto" onclick="openLayerModal()">Layers</button></div><div class="right-scroll">${graphDetailsHtml()}</div></aside></section>`}
function libraryHtml(){const q=ui.graphSearch.toLowerCase();return workspace.objects.filter(o=>!q||(`${o.id} ${o.title} ${o.layer} ${o.templateId}`).toLowerCase().includes(q)).map(o=>`<div class="library-card" draggable="true" data-object-id="${esc(o.id)}" ondragstart="dragLibrary(event,'${jsq(o.id)}')"><b>${esc(o.title)}</b><small><span>${esc(o.id)}</span><span>${esc(o.layer)}</span></small></div>`).join('')}
function worldSize(){const maxX=Math.max(1900,...Object.values(workspace.positions||{}).map(p=>(p.x||0)+300));const maxY=Math.max(workspace.layers.length*150+90,...Object.values(workspace.positions||{}).map(p=>(p.y||0)+150));return {w:maxX,h:maxY}}
function bandsHtml(){return workspace.layers.map((l,i)=>`<div class="layer-band" data-layer="${esc(l)}" style="top:${i*150+20}px;height:132px"><span class="layer-band-label">${esc(l)}</span></div>`).join('')}
function nodesHtml(){const q=ui.graphSearch.toLowerCase(),focus=ui.focusObject?connectedSet(ui.focusObject):null;return workspace.objects.map(o=>{const p=workspace.positions[o.id];if(!p)return'';const hidden=(ui.graphLayer!=='All'&&o.layer!==ui.graphLayer)||(ui.graphStatus!=='All'&&o.status!==ui.graphStatus)||(!(`${o.id} ${o.title} ${o.layer} ${o.templateId}`).toLowerCase().includes(q));const dim=focus&&!focus.has(o.id);return `<div class="graph-node ${ui.selectedObjectId===o.id?'selected':''} ${hidden?'hidden-node':''} ${dim?'dim':''}" data-node-id="${esc(o.id)}" style="left:${p.x}px;top:${p.y}px" onclick="nodeClick(event,'${jsq(o.id)}')"><span class="node-dot in"></span><div class="node-head" onpointerdown="startNodeDrag(event,'${jsq(o.id)}')"><div class="node-title">${esc(o.title)}</div><div class="node-meta"><span>${esc(o.templateId)} · ${esc(o.layer)}</span><span>${esc(o.status)}</span></div></div><div class="node-foot"><span>${esc(o.id)}</span><span>${workspace.relations.filter(r=>r.source===o.id||r.target===o.id).length} links</span></div><span class="node-dot out" onpointerdown="startConnection(event,'${jsq(o.id)}')"></span></div>`}).join('')}
function graphDetailsHtml(){if(ui.selectedRelationId){const r=relationById(ui.selectedRelationId);if(r)return relationSideHtml(r)}const o=objectById(ui.selectedObjectId);if(o)return objectSideHtml(o);return `<div class="side-card"><h2>Relationship Studio</h2><p class="confirm-text">Drag an object from the left onto a layer. Move nodes by dragging their header. Create a relation by dragging the red connector dot from one object to another, or use the Connect button.</p></div>`}
function objectSideHtml(o){const t=templateById(o.templateId),rels=workspace.relations.filter(r=>r.source===o.id||r.target===o.id);return `<div class="side-card"><span class="pill red">${esc(o.templateId)} · ${esc(t.name)}</span><h2>${esc(o.title)}</h2><div class="kv"><b>Object ID</b><span>${esc(o.id)}</span></div><div class="kv"><b>Layer</b><span>${esc(o.layer)}</span></div><div class="kv"><b>Status</b><span>${esc(o.status)}</span></div><div class="kv"><b>Criticality</b><span>${esc(o.criticality)}</span></div><div class="kv"><b>Owner</b><span>${esc(o.owner||'—')}</span></div><p class="confirm-text">${esc(o.summary||t.purpose)}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="openObjectModal('${jsq(o.id)}')">Edit</button><button class="btn" onclick="focusObject('${jsq(o.id)}')">Focus network</button><button class="primary" onclick="openRelationModal(null,'${jsq(o.id)}')">Connect</button></div></div><div class="side-title">Template Fields</div><div class="side-card">${t.fields.map(f=>{const v=o.fields?.[f.key];return v?`<div class="kv"><b>${esc(f.label)}</b><span>${esc(v)}</span></div>`:''}).join('')||'<p class="confirm-text">No template field values have been entered yet.</p>'}</div><div class="side-title">Relations (${rels.length})</div>${rels.map(r=>{const other=objectById(r.source===o.id?r.target:r.source);return `<div class="rel-card" onclick="selectRelation('${jsq(r.id)}')"><strong>${esc(r.type)} · ${esc(other?.title||'Missing')}</strong><small>${esc(r.label||r.id)}</small></div>`}).join('')||'<div class="connect-hint">No connections. Drag the red output handle to another object.</div>'}`}
function relationSideHtml(r){const s=objectById(r.source),t=objectById(r.target);return `<div class="side-card"><span class="pill red">Relationship</span><h2>${esc(r.label||r.type)}</h2><div class="kv"><b>ID</b><span>${esc(r.id)}</span></div><div class="kv"><b>Source</b><span>${esc(s?.title||r.source)}</span></div><div class="kv"><b>Type</b><span>${esc(r.type)}</span></div><div class="kv"><b>Target</b><span>${esc(t?.title||r.target)}</span></div><div class="kv"><b>Cardinality</b><span>${esc(r.cardinality||'—')}</span></div><div class="kv"><b>Criticality</b><span>${esc(r.criticality||'Medium')}</span></div><div class="kv"><b>Status</b><span>${esc(r.status||'Active')}</span></div><p class="confirm-text">${esc(r.notes||'')}</p><div style="display:flex;gap:6px"><button class="btn" onclick="openRelationModal('${jsq(r.id)}')">Edit</button><button class="btn danger" onclick="deleteRelation('${jsq(r.id)}')">Delete</button><button class="btn" onclick="selectObject('${jsq(r.source)}')">Source</button><button class="btn" onclick="selectObject('${jsq(r.target)}')">Target</button></div></div>`}

function relationshipExplorerHtml(){const size=worldSize(),z=ui.previewZoom,sw=Math.max(1,Math.ceil(size.w*z)),sh=Math.max(1,Math.ceil(size.h*z));const visibleObjects=workspace.objects.filter(previewObjectVisible).length,visibleRelations=workspace.relations.filter(previewRelationVisible).length;return `<section class="explorer-shell"><aside class="explorer-left"><div class="graph-toolbar"><input id="previewSearch" class="search" placeholder="Search field, table, rule, object…" value="${esc(ui.previewSearch)}" oninput="ui.previewSearch=this.value;applyPreviewFilters()"></div><div class="explorer-body"><div class="explorer-section"><h3>Layers</h3><div class="layer-chip-grid"><button class="layer-filter-chip ${ui.previewLayer==='All'?'active':''}" data-preview-layer="All" onclick="setPreviewLayer('All')">All</button>${workspace.layers.map(l=>`<button class="layer-filter-chip ${ui.previewLayer===l?'active':''}" data-preview-layer="${esc(l)}" onclick="setPreviewLayer('${jsq(l)}')">${esc(l)}</button>`).join('')}</div></div><div class="explorer-section"><h3>Coverage</h3><div class="explorer-metric"><span>All objects</span><b>${workspace.objects.length}</b></div><div class="explorer-metric"><span>Visible objects</span><b id="previewVisibleObjects">${visibleObjects}</b></div><div class="explorer-metric"><span>All relationships</span><b>${workspace.relations.length}</b></div><div class="explorer-metric"><span>Visible relationships</span><b id="previewVisibleRelations">${visibleRelations}</b></div><div class="explorer-metric"><span>To Verify</span><b>${workspace.objects.filter(o=>o.status==='To Verify').length}</b></div></div><div class="explorer-section"><h3>Navigation</h3><div class="preview-help">Drag an empty area to pan. Use both scrollbars or the mouse wheel to scroll. Hold Ctrl/⌘ while using the wheel to zoom around the pointer. Click an object or relationship to inspect it. Double-click an object to focus its direct network.</div></div></div></aside><div class="explorer-center"><div class="explorer-titlebar"><div class="explorer-title"><h1>Material Basic Data Relationship Explorer</h1><p>Business process → UI field → MDG attribute → staging → active table → rule → replication → test → operations</p></div><div class="explorer-controls"><select class="btn" aria-label="Preview status filter" onchange="ui.previewStatus=this.value;applyPreviewFilters()"><option>All</option>${STATUS_OPTIONS.map(s=>`<option ${ui.previewStatus===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn" onclick="previewClearFocus()">Show All</button><button class="btn" onclick="fitPreview('all')">Fit All</button><button class="btn" onclick="fitPreview('width')">Fit Width</button><button class="btn" onclick="zoomPreview(-.1)">−</button><span id="previewZoomValue" class="pill zoom-value">${Math.round(z*100)}%</span><button class="btn" onclick="zoomPreview(.1)">＋</button><button class="btn" onclick="resetPreviewView()">100%</button><button class="btn" onclick="switchTab('relations')">Edit Relations</button></div></div><div id="previewViewport" class="preview-viewport"><div id="previewStage" class="preview-stage" style="width:${sw}px;height:${sh}px"><div id="previewWorld" class="preview-world" style="width:${size.w}px;height:${size.h}px;transform:scale(${z})">${previewBandsHtml()}<svg class="preview-edge-svg" viewBox="0 0 ${size.w} ${size.h}"><defs><marker id="previewArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa4b3"></path></marker><marker id="previewArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5000f"></path></marker></defs>${previewEdgesHtml()}</svg>${previewNodesHtml()}</div></div><div class="preview-scroll-indicator">Pan · Zoom · Scroll enabled</div></div></div><aside class="explorer-right"><div class="graph-toolbar"><strong>Object Details & Connections</strong><button class="btn" style="margin-left:auto" onclick="previewClearSelection()">Clear</button></div><div id="previewDetails" class="preview-details-scroll">${previewDetailsHtml()}</div></aside></section>`}
function previewBandsHtml(){return workspace.layers.map((l,i)=>`<div class="preview-band" style="top:${i*150+20}px;height:132px"><span class="preview-band-label">${esc(l)}</span></div>`).join('')}
function previewObjectVisible(o){const q=String(ui.previewSearch||'').trim().toLowerCase();return (ui.previewLayer==='All'||o.layer===ui.previewLayer)&&(ui.previewStatus==='All'||o.status===ui.previewStatus)&&(!q||(`${o.id} ${o.title} ${o.layer} ${o.templateId} ${o.summary||''} ${Object.values(o.fields||{}).join(' ')}`).toLowerCase().includes(q))}
function previewRelationVisible(r){const a=objectById(r.source),b=objectById(r.target);return !!(a&&b&&workspace.positions[r.source]&&workspace.positions[r.target]&&previewObjectVisible(a)&&previewObjectVisible(b))}
function previewNodesHtml(){const focus=ui.previewFocusObject?connectedSet(ui.previewFocusObject):null;return workspace.objects.map(o=>{const p=workspace.positions[o.id];if(!p)return'';const hidden=!previewObjectVisible(o),dim=focus&&!focus.has(o.id),links=workspace.relations.filter(r=>r.source===o.id||r.target===o.id).length;return `<div class="graph-node preview-node ${ui.previewSelectedObjectId===o.id?'selected':''} ${hidden?'hidden-node':''} ${dim?'dim':''}" data-preview-node-id="${esc(o.id)}" style="left:${p.x}px;top:${p.y}px" onclick="previewSelectObject(event,'${jsq(o.id)}')" ondblclick="previewFocusObjectById(event,'${jsq(o.id)}')"><div class="node-head"><div class="node-title">${esc(o.title)}</div><div class="node-meta"><span>${esc(o.templateId)} · ${esc(o.layer)}</span><span>${esc(o.status)}</span></div></div><div class="node-foot"><span>${esc(o.id)}</span><span>${links} links</span></div></div>`}).join('')}
function previewEdgesHtml(){const focus=ui.previewFocusObject;return workspace.relations.map(r=>{if(!workspace.positions[r.source]||!workspace.positions[r.target])return'';const hidden=!previewRelationVisible(r),dim=focus&&r.source!==focus&&r.target!==focus,marker=r.criticality==='Critical'?'url(#previewArrowRed)':'url(#previewArrow)';return `<path class="preview-edge ${r.criticality==='Critical'?'critical':''} ${ui.previewSelectedRelationId===r.id?'selected':''} ${hidden?'hidden-edge':''} ${dim?'dim':''}" data-preview-rel-id="${esc(r.id)}" d="${edgePath(r)}" marker-end="${marker}" onclick="previewSelectRelation(event,'${jsq(r.id)}')"></path>`}).join('')}
function previewDetailsHtml(){if(ui.previewSelectedRelationId){const r=relationById(ui.previewSelectedRelationId);if(r)return previewRelationDetailsHtml(r)}const o=objectById(ui.previewSelectedObjectId);if(o)return previewObjectDetailsHtml(o);return `<div class="side-card"><span class="pill red">Read-only Explorer</span><h2>Basic Data &gt; General Data</h2><p class="confirm-text">Select any object to view its complete template-based information and all upstream or downstream connections. The data shown here is synchronized with the Template Master, Object Repository and Relationship Studio.</p></div>`}
function previewObjectDetailsHtml(o){const t=templateById(o.templateId),rels=workspace.relations.filter(r=>r.source===o.id||r.target===o.id);const filled=t.fields.filter(f=>String(o.fields?.[f.key]??'').trim());return `<div class="side-card"><span class="pill red">${esc(o.templateId)} · ${esc(t.name)}</span><h2>${esc(o.title)}</h2><div class="kv"><b>Object ID</b><span>${esc(o.id)}</span></div><div class="kv"><b>Layer</b><span>${esc(o.layer)}</span></div><div class="kv"><b>Status</b><span>${esc(o.status)}</span></div><div class="kv"><b>Criticality</b><span>${esc(o.criticality)}</span></div><div class="kv"><b>Owner</b><span>${esc(o.owner||'—')}</span></div><div class="kv"><b>Doxis ID</b><span>${esc(o.doxisId||'—')}</span></div><p class="confirm-text">${esc(o.summary||t.purpose||'')}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="openObjectFromPreview('${jsq(o.id)}')">Open Record</button><button class="btn" onclick="previewFocusObjectById(null,'${jsq(o.id)}')">Focus Network</button><button class="btn" onclick="centerPreviewObject('${jsq(o.id)}')">Center</button><button class="primary" onclick="openStudioObject('${jsq(o.id)}')">Edit Relations</button></div></div><div class="side-title">Template Fields (${filled.length}/${t.fields.length})</div><div class="side-card">${filled.map(f=>`<div class="kv"><b>${esc(f.label)}</b><span>${esc(o.fields?.[f.key])}</span></div>`).join('')||'<p class="confirm-text">No template field values have been entered.</p>'}</div><div class="side-title">Connected Objects (${rels.length})</div>${rels.map(r=>{const incoming=r.target===o.id,other=objectById(incoming?r.source:r.target);return `<div class="rel-card" onclick="previewJumpObject('${jsq(other?.id||'')}')"><strong>${incoming?'←':'→'} ${esc(r.type)} · ${esc(other?.title||'Missing object')}</strong><small>${esc(r.label||r.id)} · ${esc(r.criticality||'Medium')}</small></div>`}).join('')||'<div class="connect-hint">No relationships have been created for this object.</div>'}`}
function previewRelationDetailsHtml(r){const s=objectById(r.source),t=objectById(r.target);return `<div class="side-card"><span class="pill red">Relationship</span><h2>${esc(r.label||r.type)}</h2><div class="kv"><b>ID</b><span>${esc(r.id)}</span></div><div class="kv"><b>Source</b><span>${esc(s?.title||r.source)}</span></div><div class="kv"><b>Type</b><span>${esc(r.type)}</span></div><div class="kv"><b>Target</b><span>${esc(t?.title||r.target)}</span></div><div class="kv"><b>Direction</b><span>${esc(r.direction||'Directed')}</span></div><div class="kv"><b>Cardinality</b><span>${esc(r.cardinality||'—')}</span></div><div class="kv"><b>Criticality</b><span>${esc(r.criticality||'Medium')}</span></div><div class="kv"><b>Status</b><span>${esc(r.status||'Active')}</span></div><p class="confirm-text">${esc(r.notes||'')}</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="previewJumpObject('${jsq(r.source)}')">Source</button><button class="btn" onclick="previewJumpObject('${jsq(r.target)}')">Target</button><button class="primary" onclick="openStudioRelation('${jsq(r.id)}')">Edit Relationship</button></div></div>`}
function bindPreviewEvents(){const vp=document.getElementById('previewViewport');if(!vp)return;vp.scrollLeft=ui.previewScrollLeft||0;vp.scrollTop=ui.previewScrollTop||0;vp.addEventListener('scroll',()=>{ui.previewScrollLeft=vp.scrollLeft;ui.previewScrollTop=vp.scrollTop},{passive:true});vp.addEventListener('pointerdown',startPreviewPan);vp.addEventListener('wheel',previewWheel,{passive:false});applyPreviewFilters()}
function startPreviewPan(e){if((e.button!==0&&e.button!==1)||e.target.closest('.preview-node')||e.target.closest('.preview-edge'))return;const vp=e.currentTarget;previewPanState={vp,startX:e.clientX,startY:e.clientY,left:vp.scrollLeft,top:vp.scrollTop,pointerId:e.pointerId};vp.classList.add('panning');vp.setPointerCapture?.(e.pointerId);vp.addEventListener('pointermove',movePreviewPan);vp.addEventListener('pointerup',endPreviewPan,{once:true});vp.addEventListener('pointercancel',endPreviewPan,{once:true});e.preventDefault()}
function movePreviewPan(e){if(!previewPanState)return;const {vp,startX,startY,left,top}=previewPanState;vp.scrollLeft=left-(e.clientX-startX);vp.scrollTop=top-(e.clientY-startY)}
function endPreviewPan(){if(!previewPanState)return;const vp=previewPanState.vp;vp.classList.remove('panning');vp.removeEventListener('pointermove',movePreviewPan);ui.previewScrollLeft=vp.scrollLeft;ui.previewScrollTop=vp.scrollTop;previewPanState=null}
function previewWheel(e){if(!(e.ctrlKey||e.metaKey)){if(e.shiftKey&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();e.currentTarget.scrollLeft+=e.deltaY}return}e.preventDefault();const vp=e.currentTarget,r=vp.getBoundingClientRect();setPreviewZoom(ui.previewZoom+(e.deltaY<0 ? .1 : -.1),e.clientX-r.left,e.clientY-r.top)}
function setPreviewZoom(value,anchorX=null,anchorY=null){const vp=document.getElementById('previewViewport'),world=document.getElementById('previewWorld'),stage=document.getElementById('previewStage');const old=ui.previewZoom,next=Math.max(.1,Math.min(2.5,+value.toFixed(2)));if(!vp||!world||!stage){ui.previewZoom=next;render();return}const ax=anchorX==null?vp.clientWidth/2:anchorX,ay=anchorY==null?vp.clientHeight/2:anchorY,wx=(vp.scrollLeft+ax)/old,wy=(vp.scrollTop+ay)/old,size=worldSize();ui.previewZoom=next;world.style.transform=`scale(${next})`;stage.style.width=Math.ceil(size.w*next)+'px';stage.style.height=Math.ceil(size.h*next)+'px';const label=document.getElementById('previewZoomValue');if(label)label.textContent=Math.round(next*100)+'%';vp.scrollLeft=Math.max(0,wx*next-ax);vp.scrollTop=Math.max(0,wy*next-ay);ui.previewScrollLeft=vp.scrollLeft;ui.previewScrollTop=vp.scrollTop}
function zoomPreview(delta){setPreviewZoom(ui.previewZoom+delta)}
function fitPreview(mode='all'){const vp=document.getElementById('previewViewport');if(!vp)return;const size=worldSize(),pad=28,zw=(vp.clientWidth-pad)/size.w,zh=(vp.clientHeight-pad)/size.h,z=mode==='width'?zw:Math.min(zw,zh);setPreviewZoom(Math.max(.1,Math.min(1.35,z)),0,0);vp.scrollLeft=0;vp.scrollTop=0;ui.previewScrollLeft=0;ui.previewScrollTop=0}
function resetPreviewView(){const vp=document.getElementById('previewViewport');setPreviewZoom(1,0,0);if(vp){vp.scrollLeft=0;vp.scrollTop=0}ui.previewScrollLeft=0;ui.previewScrollTop=0}
function setPreviewLayer(layer){ui.previewLayer=layer;document.querySelectorAll('[data-preview-layer]').forEach(b=>b.classList.toggle('active',b.dataset.previewLayer===layer));applyPreviewFilters()}
function applyPreviewFilters(){const focus=ui.previewFocusObject?connectedSet(ui.previewFocusObject):null;let nodeCount=0,relCount=0;document.querySelectorAll('[data-preview-node-id]').forEach(el=>{const o=objectById(el.dataset.previewNodeId),visible=!!o&&previewObjectVisible(o);el.classList.toggle('hidden-node',!visible);el.classList.toggle('dim',!!(visible&&focus&&!focus.has(o.id)));if(visible)nodeCount++});document.querySelectorAll('[data-preview-rel-id]').forEach(el=>{const r=relationById(el.dataset.previewRelId),visible=!!r&&previewRelationVisible(r);el.classList.toggle('hidden-edge',!visible);el.classList.toggle('dim',!!(visible&&ui.previewFocusObject&&r.source!==ui.previewFocusObject&&r.target!==ui.previewFocusObject));if(visible)relCount++});const n=document.getElementById('previewVisibleObjects'),r=document.getElementById('previewVisibleRelations');if(n)n.textContent=nodeCount;if(r)r.textContent=relCount}
function previewSelectObject(e,id){e?.stopPropagation();ui.previewSelectedObjectId=id;ui.previewSelectedRelationId=null;refreshPreviewSelection()}
function previewSelectRelation(e,id){e?.stopPropagation();ui.previewSelectedRelationId=id;ui.previewSelectedObjectId=null;refreshPreviewSelection()}
function refreshPreviewSelection(){document.querySelectorAll('[data-preview-node-id]').forEach(el=>el.classList.toggle('selected',el.dataset.previewNodeId===ui.previewSelectedObjectId));document.querySelectorAll('[data-preview-rel-id]').forEach(el=>el.classList.toggle('selected',el.dataset.previewRelId===ui.previewSelectedRelationId));const d=document.getElementById('previewDetails');if(d)d.innerHTML=previewDetailsHtml()}
function previewClearSelection(){ui.previewSelectedObjectId=null;ui.previewSelectedRelationId=null;refreshPreviewSelection()}
function previewFocusObjectById(e,id){e?.stopPropagation();ui.previewFocusObject=id;ui.previewSelectedObjectId=id;ui.previewSelectedRelationId=null;applyPreviewFilters();refreshPreviewSelection()}
function previewClearFocus(){ui.previewFocusObject=null;applyPreviewFilters()}
function centerPreviewObject(id){const vp=document.getElementById('previewViewport'),p=workspace.positions[id];if(!vp||!p)return;const z=ui.previewZoom;vp.scrollTo({left:Math.max(0,(p.x+110)*z-vp.clientWidth/2),top:Math.max(0,(p.y+34)*z-vp.clientHeight/2),behavior:'smooth'});ui.previewSelectedObjectId=id;ui.previewSelectedRelationId=null;refreshPreviewSelection()}
function previewJumpObject(id){if(!id)return;centerPreviewObject(id)}
function openObjectFromPreview(id){ui.selectedObjectId=id;switchTab('objects')}
function openStudioObject(id){ui.selectedObjectId=id;ui.selectedRelationId=null;switchTab('relations')}
function openStudioRelation(id){ui.selectedRelationId=id;ui.selectedObjectId=null;switchTab('relations')}
function modalHtml(){if(!ui.modal)return'';if(ui.modal==='template')return templateModalHtml();if(ui.modal==='object')return objectModalHtml();if(ui.modal==='relation')return relationModalHtml();if(ui.modal==='category')return categoryModalHtml();if(ui.modal==='layers')return layerModalHtml();if(ui.modal==='confirm')return confirmModalHtml();return''}
function openTemplateModal(id=null){const t=id?clone(templateById(id)):{id:nextTemplateId(),name:'New Template',purpose:'',category:workspace.categories[0]?.id||'custom',sourceLevel:'Custom Template',sourceDetailed:true,fields:[{key:'object_id',label:'Object ID',guidance:'Enter permanent object ID',required:true,input:'text'}]};ui.modal='template';ui.modalData={originalId:id,template:t};render()}
function nextTemplateId(){let n=66;while(workspace.templates.some(t=>t.id==='T'+String(n).padStart(2,'0')))n++;return 'T'+String(n).padStart(2,'0')}
function templateModalHtml(){const t=ui.modalData.template;return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${ui.modalData.originalId?'Edit':'Create'} Master Template</h2><button class="btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label>Template ID</label><input id="tmId" class="form-control" value="${esc(t.id)}"></div><div class="form-group"><label>Category</label><select id="tmCategory" class="form-control">${workspace.categories.map(c=>`<option value="${esc(c.id)}" ${t.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="form-group"><label>Template Name</label><input id="tmName" class="form-control" value="${esc(t.name)}"></div><div class="form-group"><label>Source / Classification</label><input id="tmSource" class="form-control" value="${esc(t.sourceLevel||'Custom Template')}"></div><div class="form-group full"><label>Purpose</label><textarea id="tmPurpose" class="form-control">${esc(t.purpose)}</textarea></div></div><div class="object-fields"><div class="card-head" style="padding:0 0 9px;border:0"><h3>Template Fields</h3><button class="btn" onclick="addTemplateField()">＋ Add Field</button></div><div id="templateFields" class="template-fields">${t.fields.map((f,i)=>fieldEditorRow(f,i)).join('')}</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTemplateFromModal()">Save Template</button></div></div></div>`}
function fieldEditorRow(f,i){return `<div class="field-row"><span class="grab">☷</span><input class="form-control" data-f="key" data-i="${i}" value="${esc(f.key)}" placeholder="field_key"><input class="form-control" data-f="label" data-i="${i}" value="${esc(f.label)}" placeholder="Field label"><select class="form-control" data-f="input" data-i="${i}">${['text','textarea','select','date','number','checkbox'].map(x=>`<option ${f.input===x?'selected':''}>${x}</option>`).join('')}</select><label style="font-size:9px"><input type="checkbox" data-f="required" data-i="${i}" ${f.required?'checked':''}> Required</label><button class="btn danger" onclick="removeTemplateField(${i})">×</button><input class="form-control" style="grid-column:2/5" data-f="guidance" data-i="${i}" value="${esc(f.guidance||'')}" placeholder="Guidance / instruction"><input class="form-control" style="grid-column:5/7" data-f="options" data-i="${i}" value="${esc((f.options||[]).join(' | '))}" placeholder="Select options | separated"></div>`}
function syncTemplateFieldDraft(){document.querySelectorAll('[data-f]').forEach(el=>{const i=Number(el.dataset.i),k=el.dataset.f,f=ui.modalData.template.fields[i];if(!f)return;if(k==='required')f[k]=el.checked;else if(k==='options')f[k]=el.value.split('|').map(x=>x.trim()).filter(Boolean);else f[k]=el.value})}
function addTemplateField(){syncTemplateFieldDraft();ui.modalData.template.fields.push({key:'field_'+(ui.modalData.template.fields.length+1),label:'New Field',guidance:'',required:false,input:'text'});render()}
function removeTemplateField(i){syncTemplateFieldDraft();ui.modalData.template.fields.splice(i,1);render()}
function saveTemplateFromModal(){syncTemplateFieldDraft();const t=ui.modalData.template;t.id=document.getElementById('tmId').value.trim();t.name=document.getElementById('tmName').value.trim();t.category=document.getElementById('tmCategory').value;t.sourceLevel=document.getElementById('tmSource').value.trim();t.purpose=document.getElementById('tmPurpose').value.trim();if(!t.id||!t.name)return alert('Template ID and name are required.');if(t.fields.some(f=>!f.key||!f.label))return alert('Every field needs a key and label.');if(new Set(t.fields.map(f=>f.key)).size!==t.fields.length)return alert('Field keys must be unique.');const orig=ui.modalData.originalId;if(!orig&&workspace.templates.some(x=>x.id===t.id))return alert('Template ID already exists.');if(orig&&orig!==t.id&&workspace.templates.some(x=>x.id===t.id))return alert('Template ID already exists.');if(orig){const idx=workspace.templates.findIndex(x=>x.id===orig);workspace.templates[idx]=clone(t);workspace.objects.filter(o=>o.templateId===orig).forEach(o=>o.templateId=t.id)}else workspace.templates.push(clone(t));ui.selectedTemplateId=t.id;closeModal(false);scheduleSave();render();toast('Template saved')}
function duplicateTemplate(id){const t=clone(templateById(id));t.id=nextTemplateId();t.name+=' Copy';workspace.templates.push(t);ui.selectedTemplateId=t.id;scheduleSave();render();toast('Template duplicated')}
